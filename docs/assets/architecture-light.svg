<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 552" width="1040" height="552" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">claude-pr-reviewer architecture</title>
  <desc id="hero-light-desc">On your machine, a timer polls GitHub for open pull requests, reviews each new head commit with the Claude Code CLI against a read-only checkout, filters and verifies the findings, and posts one inline review back to GitHub, recording every stage in SQLite.</desc>
  <defs>
    <marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1040" height="552" rx="12" fill="#f5f5f5"/>

  <!-- zone -->
  <rect x="36" y="128" width="968" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="352" y="120" width="336" height="16" rx="2" fill="#f5f5f5"/>
  <text x="520" y="132" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YOUR MACHINE · TIMER OR CONTAINER LOOP</text>

  <!-- arrows -->
  <line x1="160" y1="88" x2="160" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-light)"/>
  <line x1="880" y1="168" x2="880" y2="88" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent-light)"/>
  <line x1="260" y1="204" x2="300" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-light)"/>
  <line x1="500" y1="204" x2="540" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-light)"/>
  <line x1="740" y1="204" x2="780" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-light)"/>
  <path d="M 260,328 H 360 Q 368,328 368,320 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-light)"/>
  <line x1="432" y1="240" x2="432" y2="432" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link-light)"/>
  <line x1="640" y1="240" x2="640" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-light)"/>
  <line x1="880" y1="240" x2="880" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-light)"/>

  <rect x="168" y="96" width="68" height="16" rx="2" fill="#f5f5f5"/>
  <text x="202" y="108" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN PRS</text>
  <rect x="772" y="96" width="100" height="16" rx="2" fill="#f5f5f5"/>
  <text x="822" y="108" fill="#eb6c36" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONE REVIEW</text>
  <rect x="308" y="272" width="52" height="16" rx="2" fill="#f5f5f5"/>
  <text x="334" y="284" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>
  <rect x="440" y="404" width="76" height="16" rx="2" fill="#f5f5f5"/>
  <text x="478" y="416" fill="#2e5aa8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAUDE -P</text>

  <!-- nodes -->
  <rect x="60" y="32" width="920" height="56" rx="8" fill="#f5f5f5"/>
  <rect x="60" y="32" width="920" height="56" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1.2"/>
  <text x="520" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GitHub</text>
  <text x="520" y="76" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">pull requests of one organization, read and written through gh</text>
  <rect x="60" y="168" width="200" height="72" rx="8" fill="#f5f5f5"/>
  <rect x="60" y="168" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="160" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Poll and skip</text>
  <text x="160" y="220" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">one search per tick</text>
  <rect x="300" y="168" width="200" height="72" rx="8" fill="#f5f5f5"/>
  <rect x="300" y="168" width="200" height="72" rx="8" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="400" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Agentic review</text>
  <text x="400" y="220" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">read-only checkout</text>
  <rect x="540" y="168" width="200" height="72" rx="8" fill="#f5f5f5"/>
  <rect x="540" y="168" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="640" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Filter and verify</text>
  <text x="640" y="220" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">fact-check, then refute</text>
  <rect x="780" y="168" width="200" height="72" rx="8" fill="#f5f5f5"/>
  <rect x="780" y="168" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="880" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Post review</text>
  <text x="880" y="220" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">anchored to diff lines</text>
  <rect x="60" y="296" width="200" height="64" rx="8" fill="#f5f5f5"/>
  <rect x="60" y="296" width="200" height="64" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.2"/>
  <text x="160" y="324" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Rubric and rules</text>
  <text x="160" y="344" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">path-scoped checklists</text>
  <rect x="540" y="296" width="440" height="64" rx="8" fill="#f5f5f5"/>
  <rect x="540" y="296" width="440" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="760" y="324" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">SQLite state</text>
  <text x="760" y="344" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">reviewed SHAs · dropped findings · spend</text>
  <rect x="300" y="432" width="200" height="56" rx="8" fill="#f5f5f5"/>
  <rect x="300" y="432" width="200" height="56" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1.2"/>
  <text x="400" y="456" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Claude models</text>
  <text x="400" y="476" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">subscription or API key</text>

  <!-- legend -->
  <line x1="36" y1="508" x2="1004" y2="508" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="36" y="532" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.12em">LEGEND</text>
  <rect x="128" y="520" width="20" height="16" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="156" y="532" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the model call</text>
  <rect x="296" y="520" width="20" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="324" y="532" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">deterministic step</text>
  <rect x="488" y="520" width="20" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1.2"/>
  <text x="516" y="532" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">external service</text>
  <line x1="668" y1="528" x2="688" y2="528" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="696" y="532" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">bookkeeping</text>
  <line x1="816" y1="528" x2="836" y2="528" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="844" y="532" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">leaves the machine</text>
</svg>
